name: Android validation
on:
 pull_request:
  paths: ['.github/workflows/android-validation.yml','android/kashnode-app/**','scripts/bundle_android_app.py','server/routes/nativeDevices.js','server/routes/edgeSms.js','server/routes/edgeCalls.js','server/routes/woocommerceWebhook.js','server/middleware/packageAccess.js','server.js','tests/edgeSms.test.js','tests/edgeCalls.test.js','db/migrations/*android_native*','db/migrations/*edge_voice_call*','db/migrations/*voice_billing_source*']
 push:
  branches: [main, feat/android-live-sms-dual-sim-calls, feat/android-sim-settings-insets-edge-call-migration]
  paths: ['.github/workflows/android-validation.yml','android/kashnode-app/**','scripts/bundle_android_app.py','server/routes/nativeDevices.js','server/routes/edgeSms.js','server/routes/edgeCalls.js','server/middleware/packageAccess.js','server.js','tests/edgeSms.test.js','tests/edgeCalls.test.js','db/migrations/*android_native*','db/migrations/*edge_voice_call*','db/migrations/*voice_billing_source*']
jobs:
 backend:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '22', cache: 'npm'}
   - run: npm ci
   - run: npm test
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - name: Setup Android SDK
     uses: android-actions/setup-android@v4
     with:
      packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.9'}
   - name: Build Android app
     working-directory: android/kashnode-app
     run: gradle wrapper --gradle-version 8.9 && ./gradlew assembleDebug
   - name: Bundle Android project
     run: python scripts/bundle_android_app.py
   - name: Upload Android APK
     uses: actions/upload-artifact@v4
     with: {name: kashnode-android-apk, path: android/kashnode-app/app/build/outputs/apk/debug/app-debug.apk}
   - name: Upload Android source bundle
     uses: actions/upload-artifact@v4
     with: {name: kashnode-android-source, path: kashnode-android.zip}
