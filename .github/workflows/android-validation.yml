name: Android validation
on:
 pull_request:
  paths: ['.github/workflows/android-validation.yml','android/kashnode-app/**','scripts/bundle_android_app.py','server/routes/nativeDevices.js','server.js','db/migrations/*android_native*']
 push:
  branches: [main]
  paths: ['.github/workflows/android-validation.yml','android/kashnode-app/**','scripts/bundle_android_app.py','server/routes/nativeDevices.js','server.js','db/migrations/*android_native*']
jobs:
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - name: Setup Android SDK
     uses: android-actions/setup-android@v4
     with:
      packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.9'}
   - name: Build Android app
     working-directory: android/kashnode-app
     run: gradle wrapper --gradle-version 8.9 && ./gradlew :app:assembleDebug
   - name: Bundle Android project
     run: python scripts/bundle_android_app.py
   - name: Upload Android APK
     uses: actions/upload-artifact@v4
     with: {name: kashnode-android-apk, path: android/kashnode-app/app/build/outputs/apk/debug/app-debug.apk}
   - name: Upload Android source bundle
     uses: actions/upload-artifact@v4
     with: {name: kashnode-android-source, path: kashnode-android.zip}
