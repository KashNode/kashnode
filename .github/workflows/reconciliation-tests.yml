name: Reconciliation checks


on:
  push:
    branches:
      - feature/order-reconciliation
  pull_request:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: reconciliation-${{ github.ref }}
  cancel-in-progress: true


jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
